[project]
name = "aion-memory-system"
version = "0.1.0"
description = "Long-term memory for conversational agents, backed by a PostgreSQL knowledge graph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "psycopg[binary]",
    "pydantic",
    "python-dotenv",
    "rank-bm25",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

# The distribution is aion-memory-system; the import name is `aion`.
[tool.uv.build-backend]
module-name = "aion"
